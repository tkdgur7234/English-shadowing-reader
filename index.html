<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 리딩 메이트 - Pro Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-dark: #1a1c22;
            --control-bg: #2d2f36;
            --accent-color: #ffeb3b;
        }

        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a237e; font-weight: 800; margin-bottom: 25px; letter-spacing: -1px; }

        /* 입력 화면 */
        #inputView textarea { width: 100%; height: 280px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 15px; font-size: 17px; resize: none; box-sizing: border-box; line-height: 1.6; outline: none; transition: border-color 0.3s; }
        #inputView textarea:focus { border-color: var(--primary-color); }
        .btn-start { display: block; width: 100%; padding: 18px; background-color: var(--primary-color); color: white; border: none; border-radius: 15px; font-size: 19px; cursor: pointer; margin-top: 20px; font-weight: bold; transition: transform 0.2s; }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(63, 81, 181, 0.3); }

        /* 플레이어 화면 */
        #playerView { display: none; }
        
        /* [핵심] 동영상 플레이어 스타일 컨트롤 바 */
        .video-player-ui { background: var(--bg-dark); border-radius: 15px; padding: 20px; margin-bottom: 25px; color: white; display: flex; flex-direction: column; align-items: center; gap: 20px; position: relative; }
        
        /* 상단: 종료 버튼 */
        .top-row { width: 100%; position: relative; }
        .stop-return-btn { position: absolute; right: 0; top: 0; background: none; border: 1px solid #555; color: #999; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .stop-return-btn:hover { color: white; border-color: white; }

        /* 중앙: 재생 관련 메인 버튼 */
        .main-controls { display: flex; align-items: center; gap: 30px; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; font-size: 24px; transition: color 0.2s, transform 0.1s; }
        .control-btn:hover { color: #bbdefb; }
        .control-btn:active { transform: scale(0.9); }
        .play-pause-btn { font-size: 50px; color: #fff; }
        
        /* [요청] 세로 카드 속도 선택 드롭다운 */
        .speed-selector-wrapper { width: 100%; text-align: center; position: relative; margin-top: 10px;}
        
        .current-speed-btn { background: var(--control-bg); border: 1px solid #444; color: #ddd; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .current-speed-btn:hover { background: #3d404a; color: white; }
        
        /* 펼쳐지는 세로 카드 컨테이너 */
        .speed-cards-dropdown { 
            display: none; /* 평소엔 숨김 */
            position: absolute; 
            bottom: 60px; /* 버튼 위에 뜸 */
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--control-bg); 
            border: 1px solid #444; 
            border-radius: 15px; 
            padding: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            z-index: 100; 
            width: 150px; 
            flex-direction: column; /* 세로 배치 */
            gap: 8px;
            max-height: 300px;
            overflow-y: auto; /* 카드 많을때 스크롤 */
        }
        .speed-cards-dropdown.active { display: flex; }

        /* 세로 속도 카드 디자인 */
        .speed-card { 
            background: #1e2025; 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: bold; 
            transition: 0.2s; 
            border: 2px solid transparent; 
            text-align: center;
        }
        .speed-card:hover { background: #3d404a; border-color: var(--primary-color); }
        .speed-card.active { background: var(--primary-color); color: white; border-color: white; }

        /* 지문 표시 */
        #displayText { font-size: 24px; line-height: 2.0; padding: 30px; background: #fff; border-radius: 15px; border: 1px solid #e0e0e0; max-height: 450px; overflow-y: auto; color: #333; }
        .word { cursor: pointer; border-radius: 5px; padding: 2px 2px; transition: background 0.2s; }
        .word:hover { background-color: #e3f2fd; color: var(--primary-color); }
        .highlight { background-color: var(--accent-color); font-weight: 800; color: #000; box-shadow: 0 4px 10px rgba(255, 235, 59, 0.5); }

        .edge-notice { background: #fff8e1; color: #795548; padding: 12px; border-radius: 10px; text-align: center; font-size: 13px; margin-top: 15px; border: 1px solid #ffe082; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎧 영어 리딩 메이트</h2>
    
    <div id="inputView">
        <textarea id="textInput" placeholder="여기에 영어 지문을 붙여넣으세요..."></textarea>
        <div class="edge-notice">
            <i class="fa-brands fa-edge"></i> <b>Edge 브라우저</b>를 사용하시면 가장 자연스러운 AI 목속리로 들으실 수 있습니다.
        </div>
        <button class="btn-start" onclick="initPlayer()">▶ 플레이어 로드</button>
    </div>

    <div id="playerView">
        <div class="video-player-ui">
            <div class="top-row">
                <button class="stop-return-btn" onclick="stopAndReturn()">종료 및 돌아가기</button>
            </div>

            <div class="main-controls">
                <button class="control-btn" title="5단어 뒤로" onclick="skipWords(-5)">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="control-btn play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
                    <i class="fa-solid fa-circle-play"></i> </button>
                <button class="control-btn" title="5단어 앞으로" onclick="skipWords(5)">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <div class="speed-selector-wrapper">
                <button class="current-speed-btn" id="speedToggleBtn" onclick="toggleSpeedMenu()">
                    속도: <span id="currentSpeedText">0.9x</span> <i class="fa-solid fa-chevron-down"></i>
                </button>
                
                <div class="speed-cards-dropdown" id="speedDropdown">
                    <div class="speed-card" onclick="setSpeed(0.5)">0.5x</div>
                    <div class="speed-card" onclick="setSpeed(0.75)">0.75x</div>
                    <div class="speed-card active" onclick="setSpeed(0.9)">0.9x</div>
                    <div class="speed-card" onclick="setSpeed(1.0)">1.0x</div>
                    <div class="speed-card" onclick="setSpeed(1.1)">1.1x</div>
                    <div class="speed-card" onclick="setSpeed(1.25)">1.25x</div>
                    <div class="speed-card" onclick="setSpeed(1.5)">1.5x</div>
                    <div class="speed-card" onclick="setSpeed(1.75)">1.75x</div>
                    <div class="speed-card" onclick="setSpeed(2.0)">2.0x</div>
                </div>
            </div>
        </div>
        
        <div id="displayText"></div>
    </div>
</div>

<script>
    let fullText = "";
    let wordsData = []; 
    let currentWordIdx = 0; 
    let utterance = null;
    let isPlaying = false;
    let playbackSpeed = 0.9;

    const playPauseBtn = document.getElementById('playPauseBtn');
    const speedDropdown = document.getElementById('speedDropdown');
    const currentSpeedText = document.getElementById('currentSpeedText');

    function getBestEnglishVoice() {
        const voices = window.speechSynthesis.getVoices();
        let bestVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Neural'));
        if (!bestVoice) bestVoice = voices.find(v => v.lang === 'en-US');
        return bestVoice;
    }

    // 목소리 목록 사전 로드
    window.speechSynthesis.getVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // [핵심] Mysterious한 끊어짐 현상을 막기 위한 강력 지문 클렌징
    function cleanText(text) {
        // 1. 온갖 종류의 특수 공백 유니코드를 일반 스페이스바(\x20)로 강제 통일
        let cleaned = text.replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ');
        // 2. 단어 중간에 찢어진 공백 정리 (s kill s ➡️ skills)
        // 이 로직은 s 단어 주변의 공백을 더 정밀하게 지웁니다.
        cleaned = cleaned.replace(/ s /g, 's'); // s 단어가 완전히 홀로 있을때만 공백 제거
        cleaned = cleaned.replace(/s /g, 's'); // s 뒤에 공백 제거 (s kill s ➡️ skill s)
        // 3. 줄바꿈을 공백으로 바꾸고, 2개 이상 연속된 공백을 1개로 합침
        cleaned = cleaned.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        return cleaned;
    }

    function initPlayer() {
        const rawText = document.getElementById('textInput').value.trim();
        if (!rawText) return alert("지문을 먼저 입력해주세요!");
        
        // [수정됨] 로드할 때 지문을 강력하게 클렌징하여 끊어짐 원천 차단
        fullText = cleanText(rawText);
        
        document.getElementById('inputView').style.display = 'none';
        document.getElementById('playerView').style.display = 'block';
        
        // 지문을 쪼갬
        const tokens = fullText.split(' '); // 클렌징 되었으므로 스페이스로만 찢음
        let html = '';
        let charCount = 0;
        let wordIdx = 0;
        wordsData = [];

        tokens.forEach(token => {
            if (token) { // 빈 단어 방지
                html += `<span class="word" id="word-${wordIdx}" onclick="playFromIndex(${wordIdx})">${token}</span> `;
                wordsData.push({ idx: wordIdx, start: charCount, length: token.length });
                wordIdx++;
                charCount += token.length + 1; // 단어 + 스페이스 길이
            }
        });
        
        document.getElementById('displayText').innerHTML = html;
        playFromIndex(0); 
    }

    function playFromIndex(wordIdx) {
        window.speechSynthesis.cancel(); 
        
        if (wordIdx >= wordsData.length) return;
        currentWordIdx = wordIdx;
        
        const startChar = wordsData[wordIdx].start;
        const textToSpeak = fullText.substring(startChar);
        
        utterance = new SpeechSynthesisUtterance(textToSpeak);
        const targetVoice = getBestEnglishVoice();
        if (targetVoice) utterance.voice = targetVoice;
        else utterance.lang = 'en-US';
        
        utterance.rate = playbackSpeed;

        utterance.onboundary = function(e) {
            if (e.name === 'word') {
                const absChar = startChar + e.charIndex;
                const currentWord = wordsData.find(w => absChar >= w.start && absChar < w.start + w.length);
                
                if (currentWord) {
                    currentWordIdx = currentWord.idx;
                    const oldHighlight = document.querySelector('.highlight');
                    if (oldHighlight) oldHighlight.classList.remove('highlight');
                    
                    const wordSpan = document.getElementById(`word-${currentWord.idx}`);
                    if (wordSpan) {
                        wordSpan.classList.add('highlight');
                        wordSpan.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            }
        };

        utterance.onend = function() {
            isPlaying = false;
            updatePlayBtnUI();
        };

        window.speechSynthesis.speak(utterance);
        isPlaying = true;
        updatePlayBtnUI();
    }

    function togglePlayPause() {
        if (isPlaying) {
            window.speechSynthesis.pause();
            isPlaying = false;
        } else {
            // 정지 상태였다면 다시 resume
            if(window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            } else {
                playFromIndex(currentWordIdx); // 새로 시작
            }
            isPlaying = true;
        }
        updatePlayBtnUI();
    }

    function updatePlayBtnUI() {
        if (isPlaying) {
            playPauseBtn.innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
        } else {
            playPauseBtn.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
        }
    }

    // [요청됨] 세로 속도 메뉴 토글
    function toggleSpeedMenu() {
        speedDropdown.classList.toggle('active');
    }

    // [요청됨] 속도 카드 클릭 시 속도 설정
    function setSpeed(speed) {
        playbackSpeed = speed;
        currentSpeedText.innerText = speed + 'x';
        
        // 카드 UI 업데이트
        const cards = document.querySelectorAll('.speed-card');
        cards.forEach(card => {
            card.classList.remove('active');
            if(parseFloat(card.innerText) === speed) card.classList.add('active');
        });
        
        speedDropdown.classList.remove('active'); // 메뉴 닫기
        
        // 재생 중이라면 바뀐 속도로 즉시 반영
        if (isPlaying || window.speechSynthesis.speaking) {
             playFromIndex(currentWordIdx);
        }
    }

    function skipWords(count) {
        let newIdx = currentWordIdx + count;
        if (newIdx < 0) newIdx = 0;
        if (newIdx >= wordsData.length) newIdx = wordsData.length - 1;
        playFromIndex(newIdx); 
    }

    function stopAndReturn() {
        window.speechSynthesis.cancel();
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('inputView').style.display = 'block';
    }

    // 드롭다운 외부 클릭 시 메뉴 닫기
    window.addEventListener('click', function(e) {
        if (!document.getElementById('speedToggleBtn').contains(e.target) && !speedDropdown.contains(e.target)) {
            speedDropdown.classList.remove('active');
        }
    });
</script>
</body>
</html>
